<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8a6726"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3,2"/>
  
  <!-- Scales of Justice Symbol -->
  <!-- Center Column -->
  <path d="M50 18 L50 74" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Top Finial / Star -->
  <circle cx="50" cy="18" r="3.5" fill="url(#goldGrad)"/>
  <!-- Crossbeam -->
  <path d="M26 31 L74 31" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left Pan Strings & Pan -->
  <path d="M26 31 L20 48 M26 31 L32 48" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M17 48 Q26 55 35 48 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Right Pan Strings & Pan -->
  <path d="M74 31 L68 48 M74 31 L80 48" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M65 48 Q74 55 83 48 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Base Pedestal -->
  <path d="M38 74 L62 74 M42 78 L58 78 M35 82 L65 82" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
